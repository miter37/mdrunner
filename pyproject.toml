[project]
name = "mdrunner"
version = "0.1.0"
description = "Schedule md-driven CLI agent tasks (opencode, codex, openclaw) across Linux and Windows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mdrunner" }]
dependencies = [
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "httpx>=0.27"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
mdrunner = "mdrunner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdrunner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = ["gui: tests that require PySide6 + a display (or offscreen Qt)"]